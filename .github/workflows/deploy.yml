# Deploys the app to the existing Cloudflare Pages project on every push to main.
# Pages' own Git link can't follow this repo since it moved to blk-phx-labs, and a new
# project would change the pages.dev URL, which strands phone data and the Google sign-in.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Stage app files only
        run: |
          mkdir -p site/assets
          cp index.html privacy.html manifest.json sw.js _redirects site/
          cp -r assets/brand site/assets/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 992d365604439945e980e38b5338b008
          wranglerVersion: "4.98.0"
          command: pages deploy site --project-name=blkphx-ph3 --branch=main --commit-hash=${{ github.sha }}
